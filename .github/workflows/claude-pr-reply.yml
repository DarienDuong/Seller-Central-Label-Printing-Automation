name: Claude PR Comment Reply

# When someone (human or bot) replies inside a review-comment thread (e.g.
# pushing back on a finding from claude-pr-review.yml), this evaluates the
# reply against the actual code and replies in-thread — agreeing with
# reasoning if the pushback holds up, or explaining concretely why the
# finding still stands if it doesn't.
#
# There is deliberately no `if: ...user.type != 'Bot'` guard on the job.
# Much of this repo's PR and review-comment traffic is itself bot-authored,
# so an author-type filter would skip most of the pushback this workflow
# exists to answer.
#
# Loop safety instead rests on: the prompt tells Claude to post via `gh`,
# which authenticates with the GH_TOKEN below (the workflow's own
# GITHUB_TOKEN, attributed to github-actions[bot]), and GitHub Actions does
# not let a GITHUB_TOKEN-authored event start a new workflow run. So this
# workflow's own replies should not re-trigger it.
#
# UNVERIFIED, confirm on the first live run: that claude-code-action doesn't
# hand `gh` a Claude GitHub App installation token instead, which would post
# as claude[bot] — an app-token-authored comment CAN start a new run, which
# would mean a reply loop. Belt-and-suspenders, the prompt below also bails
# if the comment it's answering was posted by a bot it recognises as itself.
# If the first run shows replies landing as claude[bot], add
# `if: github.event.comment.user.login != 'claude[bot]'` to the job.
#
# The prompt also tells Claude to no-op on non-substantive replies, so it
# isn't answering every "thanks" either.
#
# Requires the same GitHub App + ANTHROPIC_API_KEY secret as claude-pr-review.yml.
on:
  pull_request_review_comment:
    types: [created]

jobs:
  reply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read/Grep/Glob so it can check the reply's claims against the real
          # files; Write so it can build the JSON payload step 4 posts.
          claude_args: >-
            --max-turns 20
            --allowedTools "Bash(gh:*),Bash(git:*),Read,Grep,Glob,Write"
          prompt: |
            Someone just posted comment id ${{ github.event.comment.id }} on PR
            #${{ github.event.pull_request.number }} in ${{ github.repository }}, replying inside a
            review-comment thread. The commenter may be a human or a bot — treat either the same way,
            engaging with what they actually wrote.

            First, check who posted it (`gh api repos/${{ github.repository }}/pulls/comments/${{ github.event.comment.id }}`
            — note the id goes on `/pulls/comments/<id>`, NOT `/pulls/<pr>/comments/<id>`, which 404s):
            if the author is `github-actions[bot]` or `claude[bot]`, this is a comment you posted
            yourself — do nothing and exit. Never reply to your own comment, whichever identity it
            was posted under.

            Otherwise, only act if the reply is substantively engaging with a review finding — arguing
            it's wrong, explaining a fix, or asking a technical question about it. If it's unrelated
            chit-chat, a simple "thanks", or not a reply inside one of the review threads, do nothing and
            exit.

            1. Fetch the full comment list to reconstruct the thread:
               `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
               Find comment ${{ github.event.comment.id }}, then walk `in_reply_to_id` to find the root
               comment of its thread and every reply already in it, so you have the original finding and
               the full back-and-forth.
            2. Get the current diff/code: `gh pr diff ${{ github.event.pull_request.number }}`, and read
               the actual file(s) at their current state on this branch to check the claims in the reply
               against real code — don't take the reply's word for it.
            3. Decide, on the merits:
               - If the reply resolves or invalidates the original finding, reply in the thread agreeing,
                 and say concretely what changed your mind — quote the specific line or logic that
                 convinced you. Don't just say "agreed."
               - If the finding still holds, reply explaining specifically why the pushback doesn't
                 address the failure scenario — point at the code that still has the problem.
               - It is fine, and expected, to concede a point when the code genuinely shows you were
                 wrong. It is also fine to hold your ground. Do not default to agreement to be polite, and
                 do not manufacture disagreement to seem thorough — ground the decision in what the code
                 actually does.
            4. Post your reply as a new comment in the same thread (not a new top-level comment).
               Write the payload to a JSON file and pass it with --input:
                 `{"body": "<your reply>", "in_reply_to": <root_comment_id as a number>}`
                 `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments -X POST --input payload.json`
               Use this JSON form rather than `-f in_reply_to=...`: `-f` sends every value as a
               string, and this endpoint wants `in_reply_to` as a number. Do not mix `--input` with
               `-f`/`-F` on the same call — that fails schema validation with
               "No subschema in oneOf matched".
